<!DOCTYPE html>
<html lang="fr-BE">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- L’administration ne doit pas apparaître dans les moteurs de recherche -->
    <meta name="robots" content="noindex">
    <title>Administration du site</title>
</head>
<body>
    <!--
        Decap CMS. L’interface s’affiche en français grâce à `locale: fr` dans
        config.yml. Cela suppose de charger le paquet complet `decap-cms`
        ci-dessous, qui embarque les traductions : le paquet `decap-cms-app`,
        plus petit, ne les contient pas et resterait en anglais.

        Si tu préfères une interface plus moderne, mieux adaptée au téléphone et
        plus agréable pour les photos — au prix d’une interface en anglais —
        remplace la balise ci-dessous par celle de Sveltia CMS. Les deux outils
        lisent le même fichier config.yml, il n’y a rien d’autre à changer :

        <script src="https://unpkg.com/@sveltia/cms@0.185.0/dist/sveltia-cms.js"></script>

        Voir la section « Choisir son interface d’administration » du README.
    -->
    <script src="https://unpkg.com/decap-cms@3.15.1/dist/decap-cms.js"></script>

    <!--
        Gabarits du volet d’aperçu, à droite de l’éditeur. À charger après Decap
        CMS, dont ce fichier utilise `CMS`, `createClass` et `h`.
    -->
    <script src="apercu.js"></script>
</body>
</html>
