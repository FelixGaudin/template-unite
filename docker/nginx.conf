# Configuration nginx pour servir le site construit.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Les adresses du site sont des dossiers contenant un index.html
    # (/agenda/, /actualites/camps-ete/, …).
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;

    # L’administration n’a pas à être indexée par les moteurs de recherche.
    #
    # `^~` est indispensable ici : sans lui, la redirection interne de try_files
    # vers /admin/index.html repasserait par la règle `\.html$` plus bas, qui
    # remplacerait les en-têtes et ferait disparaître le X-Robots-Tag.
    location ^~ /admin/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Les polices et images portent un nom stable : on peut les garder en cache
    # longtemps. Les pages HTML, elles, doivent rester fraîches après une
    # modification depuis /admin.
    location ~* \.(woff2?|ttf|otf|eot|png|jpe?g|gif|svg|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
