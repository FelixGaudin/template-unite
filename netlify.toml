# Réglages de publication pour Netlify.
#
# Ce fichier étant à la racine du dépôt, Netlify le lit tout seul : il n'y a
# aucun réglage à saisir dans son interface.

[build]
  command = "npm run build"
  publish = "_site"

# L'administration ne doit pas être indexée par les moteurs de recherche.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"
