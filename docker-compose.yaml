# Site + administration en local, sans installer Node sur sa machine.
#
#   docker compose up
#
#   · le site           http://localhost:8080/
#   · l’administration  http://localhost:8080/admin/
#
# Les fichiers du dépôt sont montés dans le conteneur : les modifications faites
# depuis /admin sont écrites directement sur ta machine, et le site se
# reconstruit tout seul.
#
# Tout passe par le port 8080, y compris l’API d’écriture de l’administration.
# Le pont qui l’assure n’écoute que sur la machine locale, à l’intérieur du
# conteneur : il n’y a donc qu’un seul port à ouvrir, et l’API ne peut pas être
# appelée en contournant le mot de passe.

services:
  site:
    build:
      context: .
      target: developpement
    # Les contenus d’exemple sont recopiés dans `donnees/` au premier démarrage,
    # puis plus jamais touchés.
    # `clean` purge le site généré : sans cela, une page supprimée resterait
    # accessible par son adresse, Eleventy ne retirant pas ce qu'il a déjà écrit.
    command: sh -c "node scripts/preparer-donnees.mjs && npm run clean && npm run dev"
    ports:
      - '2121:8080'
    volumes:
      - .:/site

      # Ce que l’administration modifie vit dans `donnees/`, en dehors de ce
      # que suit git. Sans cela, chaque modification faite depuis /admin
      # apparaîtrait comme une modification locale du dépôt et empêcherait
      # `git pull` de s’appliquer sur le serveur.
      #
      # Ces trois dossiers sont aussi ce qu’il faut sauvegarder : ils
      # contiennent tout le travail de l’unité.
      - ./donnees/contenus:/site/src/contenus
      - ./donnees/medias:/site/src/medias
      - ./donnees/reglages:/site/src/_data

      # Les dépendances installées dans l’image ne doivent pas être masquées par
      # le node_modules de la machine hôte, qui peut être absent ou contenir des
      # binaires compilés pour un autre système.
      - deps:/site/node_modules
    # Les fichiers écrits dans le volume appartiennent à cet utilisateur. Sans
    # cela, ils appartiendraient à root sur ta machine.
    user: '${UID:-1000}:${GID:-1000}'
    # Fournit un vrai processus d’init : les deux processus lancés par
    # `npm run dev` sont alors correctement arrêtés et nettoyés.
    init: true
    environment:
      # Protège /admin par un mot de passe. Laissé vide, l’administration est
      # ouverte — acceptable sur son propre ordinateur, jamais sur une machine
      # accessible par d’autres.
      #
      # Le mot de passe se donne au lancement, pour ne pas se retrouver dans un
      # fichier versionné :
      #
      #   ADMIN_MOT_DE_PASSE='choisis-un-mot-de-passe' docker compose up
      #
      # Ou dans un fichier `.env` à côté de ce fichier, qui n’est pas versionné.
      #
      # À laisser vide si un reverse proxy protège déjà `/admin*` : c’est la
      # seule adresse à couvrir, l’API d’écriture se trouvant sous elle. Voir
      # « Protéger l’administration » dans le README.
      ADMIN_MOT_DE_PASSE: '${ADMIN_MOT_DE_PASSE:-}'
      # L’identifiant à saisir avec le mot de passe. « admin » par défaut.
      ADMIN_UTILISATEUR: '${ADMIN_UTILISATEUR:-admin}'

  # Pour ne servir que le site public, sans l’administration :
  #   docker compose run --rm --service-ports site npm start

volumes:
  deps:
